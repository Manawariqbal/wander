<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6fbf3f">
  <title>wander</title>
  <style>
    :root {
      --sky: #b9e46a;
      --meadow: #58b036;
      --field: #2e8a35;
      --deep: #0e3c1e;
      --dew: #f5ffe0;
      --sun: #fff6b0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky) 0%, var(--meadow) 48%, var(--field) 100%);
      color: var(--dew);
      font-family: ui-rounded, "Avenir Next Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* morning sun, top right */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(circle at 82% 8%, rgba(255, 246, 176, .85) 0, rgba(255, 246, 176, 0) 42%);
      pointer-events: none;
    }

    #hit {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0);
    }
    .scene {
      display: flex; flex-direction: column; align-items: center; gap: 34px;
      transform: translateY(-7vh);
      text-align: center;
    }

    /* the dewdrop */
    .orb-wrap {
      position: relative;
      width: min(46vw, 210px);
      aspect-ratio: 1;
      display: grid; place-items: center;
    }
    .orb {
      width: 100%; height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 31% 27%, #fff 0 5%, rgba(255, 255, 255, 0) 6.5%),
        radial-gradient(circle at 50% 58%, #eaffb4 0%, #a3e35e 46%, #3f9f3a 100%);
      box-shadow:
        0 0 70px 12px rgba(255, 246, 176, .55),
        inset 0 -16px 34px rgba(14, 60, 30, .35),
        inset 0 12px 24px rgba(255, 255, 255, .55);
      animation: float 5s ease-in-out infinite;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .75);
      opacity: 0;
    }

    /* the one status pill */
    .pill {
      max-width: min(86vw, 420px);
      padding: 14px 28px 15px;
      border-radius: 24px;
      background: rgba(14, 60, 30, .8);
    }
    #label {
      font-size: clamp(22px, 5.6vw, 30px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .01em;
    }
    #hint {
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.35;
      color: #d9f2b5;
    }
    #hint:empty { display: none; }

    /* grass */
    #grass {
      position: fixed; left: 0; bottom: 0; width: 100%;
      pointer-events: none;
    }
    .blade {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: sway 5s ease-in-out infinite alternate;
    }

    /* states */
    body[data-state="listening"] .orb { animation: none; transform: scale(1.07); }
    body[data-state="listening"] .ring { animation: ripple 2.4s ease-out infinite; }
    body[data-state="listening"] .r2 { animation-delay: .8s; }
    body[data-state="listening"] .r3 { animation-delay: 1.6s; }

    body[data-state="thinking"] .orb { animation: breathe 1.1s ease-in-out infinite; }
    body[data-state="thinking"] .r1 {
      opacity: .9; inset: -14px;
      border-style: dashed; border-color: rgba(255, 255, 255, .85);
      animation: spin 3s linear infinite;
    }

    body[data-state="speaking"] .orb { animation: breathe 1.7s ease-in-out infinite; }

    body[data-state="offline"] .orb { animation: none; filter: saturate(.35) brightness(.92); }
    body[data-state="offline"] .blade { animation-play-state: paused; }

    @keyframes float   { 0%, 100% { transform: translateY(0); }  50% { transform: translateY(-9px); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); }       50% { transform: scale(1.09); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes ripple  { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.75); opacity: 0; } }
    @keyframes sway    { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }

    @media (prefers-reduced-motion: reduce) {
      .orb, .ring, .blade { animation: none !important; }
    }

    /* app.js writes its state into #status; the page shows it through #label instead */
    #status {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
  </style>
</head>
<body data-state="begin">
  <div id="hit">
    <div class="scene">
      <div class="orb-wrap">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <div class="orb"></div>
      </div>
      <div class="pill" role="status" aria-live="polite">
        <div id="label">Tap anywhere to begin</div>
        <div id="hint">Allow the microphone and location when asked.</div>
      </div>
    </div>
    <svg id="grass" aria-hidden="true"></svg>
  </div>
  <div id="status">tap to begin</div>

  <script>
    // ---- status text from app.js -> friendly label + visual state ----
    const STATES = {
      "tap to begin": ["Tap anywhere to begin", "Allow the microphone and location when asked.", "begin"],
      "ready":        ["Tap to talk", "", "ready"],
      "listening":    ["Listening", "Pause when you're done.", "listening"],
      "thinking":     ["Thinking", "", "thinking"],
      "speaking":     ["Speaking", "Tap to interrupt.", "speaking"],
      "reconnecting": ["Can't reach the server", "Check that it's running and your tunnel is connected.", "offline"],
      "mic blocked":  ["Microphone blocked", "Allow it in the browser's site settings, then reload.", "offline"],
    };
    const src = document.getElementById("status");
    const label = document.getElementById("label");
    const hint = document.getElementById("hint");
    function sync() {
      const key = src.textContent.trim().toLowerCase();
      const s = STATES[key] || [key, "", "ready"];
      label.textContent = s[0];
      hint.textContent = s[1];
      document.body.dataset.state = s[2];
    }
    new MutationObserver(sync).observe(src, { childList: true, characterData: true, subtree: true });
    sync();

    // ---- grass: three layers of blades, drawn to the real screen width ----
    (function () {
      const svg = document.getElementById("grass");
      const NS = "http://www.w3.org/2000/svg";
      const H = 170;
      const LAYERS = [
        { gap: 17, h: [80, 150], color: "#3f9f3a", opacity: 0.6 },
        { gap: 15, h: [60, 120], color: "#2a8433", opacity: 0.85 },
        { gap: 13, h: [38, 84],  color: "#14502a", opacity: 1 },
      ];
      function draw() {
        const W = Math.max(window.innerWidth, 320);
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        svg.setAttribute("width", W);
        svg.setAttribute("height", H);
        svg.innerHTML = "";
        let seed = 11;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (const L of LAYERS) {
          const g = document.createElementNS(NS, "g");
          g.setAttribute("fill", L.color);
          g.setAttribute("opacity", L.opacity);
          for (let x = -6; x < W + 6; x += L.gap * (0.7 + rnd() * 0.6)) {
            const h = L.h[0] + rnd() * (L.h[1] - L.h[0]);
            const w = 4 + rnd() * 5;
            const lean = (rnd() - 0.5) * 26;
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d",
              `M${x - w},${H} Q${x - w / 2 + lean * 0.3},${H - h * 0.6} ${x + lean},${H - h} ` +
              `Q${x + w / 2 + lean * 0.3},${H - h * 0.55} ${x + w},${H} Z`);
            p.setAttribute("class", "blade");
            p.style.animationDuration = (3.5 + rnd() * 3.5).toFixed(2) + "s";
            p.style.animationDelay = (-rnd() * 6).toFixed(2) + "s";
            g.appendChild(p);
          }
          svg.appendChild(g);
        }
      }
      draw();
      let t;
      window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 200); });
    })();
  </script>
  <script src="app.js?v=2"></script>
</body>
</html>
